  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px;border-radius:3px}\n  .sent.show{display:block;animation:fade .5s ease}\n  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  .sent h3{font-size:23px;font-weight:600;margin:10px 0 8px;letter-spacing:-0.015em}\n  .sent p{color:var(--ink-2);font-size:15px;max-width:36ch}\n  .sent .ref{margin-top:20px;color:var(--ink-3)}\n\n  /* closing CTA */\n  .closer{padding:130px 0;text-align:center;border-top:1px solid var(--line)}\n  .closer h2{max-width:18ch;margin:0 auto 16px}\n  .closer p{color:var(--ink-2);font-size:18px;max-width:40ch;margin:0 auto 40px;line-height:1.55}\n  .closer .hero-cta{justify-content:center}\n\n  /* footer */\n  footer{border-top:1px solid var(--line);padding:64px 0 40px}\n  .foot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;flex-wrap:wrap}\n  .foot-tag{color:var(--ink-2);font-size:15px;margin-top:18px;max-width:30ch;line-height:1.55}\n  .foot-nav{display:flex;gap:60px;flex-wrap:wrap}\n  .foot-col h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px}\n  .foot-col a{display:block;font-size:15px;color:var(--ink-2);padding:5px 0;transition:color .2s}\n  .foot-col a:hover{color:var(--ink)}\n  .foot-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:1px solid var(--line-2);color:var(--ink-3)}\n\n  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}\n  .reveal.in{opacity:1;transform:none}\n\n  @media(max-width:920px){\n    .wrap{padding:0 24px}\n    nav.links{display:none}\n    .hero{padding:130px 0 0}\n    .lanes,.paths{grid-template-columns:1fr}\n    .lane{min-height:auto}\n    .caps{grid-template-columns:1fr}\n    .row2{grid-template-columns:1fr}\n    .insight{padding:84px 0}\n    .sec{padding:76px 0}\n    .lane .status{position:static;align-self:flex-start;margin-bottom:18px}\n    .gl-top{align-items:flex-start}\n  }\n  @media(max-width:540px){\n    .node .lab{display:none}\n    .map-cap{font-size:11px}\n  }\n  @media(prefers-reduced-motion:reduce){\n    *{animation:none!important;scroll-behavior:auto!important}\n    .reveal{opacity:1;transform:none;transition:none}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<header id=\"hdr\">\n  <div class=\"wrap bar\">\n    <a href=\"#top\" class=\"brand\"><img src=\"21815539-3fc3-49e1-a4b1-47162ac8d979\" alt=\"Pilot Projects\">Pilot Projects<\u002Fa>\n    <nav class=\"links\">\n      <a href=\"#what\">What we do<\u002Fa>\n      <a href=\"#capabilities\">Capabilities<\u002Fa>\n      <a href=\"#work\">How to start<\u002Fa>\n      <a href=\"#global\">Global<\u002Fa>\n    <\u002Fnav>\n    <a href=\"#work\" class=\"btn\">Work with us<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<a id=\"top\"><\u002Fa>\n<section class=\"hero\" data-screen-label=\"Hero\">\n  <div class=\"wrap\">\n    <div class=\"hero-tag mono\"><span class=\"d\"><\u002Fspan>Operations &amp; Ventures<\u002Fdiv>\n    <h1 class=\"display\">We don't advise companies. <span class=\"muted\">We operate them.<\u002Fspan><\u002Fh1>\n    <p class=\"hero-sub\">Pilot Projects embeds a hands-on operating team inside growing companies — owning the systems, hiring, and day-to-day execution that turn momentum into a machine. <b>And we build ventures of our own.<\u002Fb><\u002Fp>\n    <div class=\"hero-cta\">\n      <a href=\"#work\" class=\"btn btn-lg\">Work with us<\u002Fa>\n      <a href=\"#ventures\" class=\"btn btn-ghost btn-lg\">Pitch a venture →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"strip\">\n      <span class=\"lbl mono\">Introduced through teams like<\u002Fspan>\n      <div class=\"names\">\n        <span>Angel Squad<\u002Fspan>\n        <span>QED Investors<\u002Fspan>\n        <span>Women on Boards<\u002Fspan>\n        <span>Osiris<\u002Fspan>\n        <span>CrewGrab<\u002Fspan>\n        <span>On Deck<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- INSIGHT -->\n<section class=\"insight\" data-screen-label=\"Insight\">\n  <div class=\"wrap\">\n    <div class=\"k mono reveal\">Why we exist<\u002Fdiv>\n    <p class=\"reveal\">Growth breaks the operating system. <span class=\"dim\">Most teams paper over it with another tool, or another consultant's deck. We step in and run it.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHAT WE DO -->\n<section class=\"sec\" id=\"what\" data-screen-label=\"What we do\">\n  <div class=\"wrap\">\n    <div class=\"sec-label mono reveal\"><span class=\"num\">01<\u002Fspan><span>What we do<\u002Fspan><\u002Fdiv>\n    <div class=\"lanes reveal\">\n      <div class=\"lane\">\n        <div class=\"tag mono\">Operations<\u002Fdiv>\n        <span class=\"status\">By referral<\u002Fspan>\n        <h3>We run your engine room<\u002Fh3>\n        <p>We embed alongside your team and take ownership of the operational work that's holding growth back — not a strategy deck, the actual running of it.<\u002Fp>\n        <a href=\"#work\" class=\"go\">See how to start <span class=\"ar\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div class=\"lane\">\n        <div class=\"tag mono\">Ventures<\u002Fdiv>\n        <span class=\"status\">Open to pitches<\u002Fspan>\n        <h3>We build our own<\u002Fh3>\n        <p>We start and back companies on the same workbench — and partner with founders who want operators in the room from day one, not just a cheque.<\u002Fp>\n        <a href=\"#ventures\" class=\"go\">Pitch a venture <span class=\"ar\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CAPABILITIES -->\n<section class=\"sec\" id=\"capabilities\" data-screen-label=\"Capabilities\">\n  <div class=\"wrap\">\n    <div class=\"sec-label mono reveal\"><span class=\"num\">02<\u002Fspan><span>Capabilities<\u002Fspan><\u002Fdiv>\n    <div class=\"cap-intro reveal\">\n      <h2>The work we<br>actually own.<\u002Fh2>\n      <p>Not advice you have to go implement. We staff operators who've run this before and hand back working systems, your team trained on them.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"caps reveal\">\n      <div class=\"cap\"><div class=\"ci\">01<\u002Fdiv><h4>Revenue &amp; GTM operations<\u002Fh4><p>Pipeline, CRM, reporting and the go-to-market motion — built to run without heroics.<\u002Fp><\u002Fdiv>\n      <div class=\"cap\"><div class=\"ci\">02<\u002Fdiv><h4>Finance &amp; reporting<\u002Fh4><p>Models, board packs, cash discipline and fundraising readiness that stands up to scrutiny.<\u002Fp><\u002Fdiv>\n      <div class=\"cap\"><div class=\"ci\">03<\u002Fdiv><h4>Hiring &amp; team building<\u002Fh4><p>Org design, recruiting and onboarding — so the right people land and ramp fast.<\u002Fp><\u002Fdiv>\n      <div class=\"cap\"><div class=\"ci\">04<\u002Fdiv><h4>Systems &amp; automation<\u002Fh4><p>The tooling stack and the workflows that connect it, so work moves without friction.<\u002Fp><\u002Fdiv>\n      <div class=\"cap\"><div class=\"ci\">05<\u002Fdiv><h4>Programs &amp; delivery<\u002Fh4><p>We run the cross-team projects that keep slipping — owned end to end, shipped on time.<\u002Fp><\u002Fdiv>\n      <div class=\"cap\"><div class=\"ci\">06<\u002Fdiv><h4>Founder leverage<\u002Fh4><p>We take the operational weight off the founder's desk so they can do the few things only they can.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- GLOBAL (dark map band) -->\n<section class=\"sec global\" id=\"global\" data-screen-label=\"Global\">\n  <div class=\"wrap\">\n    <div class=\"gl-top reveal\">\n      <div>\n        <div class=\"sec-label mono\"><span class=\"num\">03<\u002Fspan><span>Global<\u002Fspan><\u002Fdiv>\n        <h2>Someone is always<br>awake to run it. <em><\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"gl-sub\">Eight stations across four continents and seven time zones — so the work never waits for morning.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"map-wrap reveal\">\n      <div class=\"map-top mono\">\n        <span class=\"live\"><span class=\"d\"><\u002Fspan>Live · local time<\u002Fspan>\n        <span class=\"stat\"><span>08 stations<\u002Fspan><span>04 continents<\u002Fspan><span>07 time zones<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"map\" id=\"map\">\n        <svg viewBox=\"0 0 1000 470\" preserveAspectRatio=\"none\" id=\"mapsvg\"><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"map-cap mono\">\n        <span>Bangkok · Dubai · Mauritius · Cape Town · London · Miami · Chicago · Denver<\u002Fspan>\n        <span>PP / GLOBAL OPS<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW TO START -->\n<section class=\"sec\" id=\"work\" data-screen-label=\"How to start\">\n  <div class=\"wrap\">\n    <div class=\"sec-label mono reveal\"><span class=\"num\">04<\u002Fspan><span>How to start<\u002Fspan><\u002Fdiv>\n    <div class=\"paths\">\n      <div class=\"path reveal\">\n        <div class=\"ph\"><span class=\"pn\">Path A<\u002Fspan><h3>Operations — by referral<\u002Fh3><\u002Fdiv>\n        <p class=\"pdesc\">We take on a small number of operating partners at a time, and we've found the best ones come <b>warmly introduced<\u002Fb> by people we already work with. If you know someone inside one of these teams, ask them for an intro — that's the front door.<\u002Fp>\n        <div class=\"gw-label mono\">Ask for an introduction through<\u002Fdiv>\n        <a class=\"gw\" href=\"https://www.hustlefund.vc/squad\" target=\"_blank\" rel=\"noopener\"><span class=\"gw-name\">Angel Squad<\u002Fspan><span class=\"meta\">hustlefund.vc ↗<\u002Fspan><\u002Fa>\n        <a class=\"gw\" href=\"https://www.qedinvestors.com/\" target=\"_blank\" rel=\"noopener\"><span class=\"gw-name\">QED Investors<\u002Fspan><span class=\"meta\">qedinvestors.com ↗<\u002Fspan><\u002Fa>\n        <a class=\"gw\" href=\"https://www.wobproject.com/\" target=\"_blank\" rel=\"noopener\"><span class=\"gw-name\">Women on Boards Project<\u002Fspan><span class=\"meta\">wobproject.com ↗<\u002Fspan><\u002Fa>\n        <a class=\"gw\" href=\"https://ocs.world/\" target=\"_blank\" rel=\"noopener\"><span class=\"gw-name\">Osiris International Group<\u002Fspan><span class=\"meta\">ocs.world ↗<\u002Fspan><\u002Fa>\n        <a class=\"gw\" href=\"https://www.crewgrab.com/\" target=\"_blank\" rel=\"noopener\"><span class=\"gw-name\">CrewGrab<\u002Fspan><span class=\"meta\">crewgrab.com ↗<\u002Fspan><\u002Fa>\n        <a class=\"gw\" href=\"https://joinodf.com/\" target=\"_blank\" rel=\"noopener\"><span class=\"gw-name\">On Deck<\u002Fspan><span class=\"meta\">joinodf.com ↗<\u002Fspan><\u002Fa>\n        <p class=\"gw-foot\">Not sure who to ask? <b>Pitch a venture<\u002Fb> on the right, or mention a mutual connection — we'll find the line.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"path reveal\" id=\"ventures\">\n        <div class=\"ph\"><span class=\"pn\">Path B<\u002Fspan><h3>Ventures — pitch us directly<\u002Fh3><\u002Fdiv>\n        <p class=\"pdesc\">Building something and want operators in the room? Tell us what you're making and what you need. <b>We reply within 48 hours.<\u002Fb><\u002Fp>\n        <form id=\"pitch\">\n          <div class=\"row2\">\n            <div class=\"field\"><label for=\"f-name\">Your name<\u002Flabel><input id=\"f-name\" required=\"\" name=\"name\" autocomplete=\"name\"><\u002Fdiv>\n            <div class=\"field\"><label for=\"f-email\">Email<\u002Flabel><input id=\"f-email\" required=\"\" type=\"email\" name=\"email\" autocomplete=\"email\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\"><label for=\"f-build\">What are you building?<\u002Flabel><textarea id=\"f-build\" required=\"\" name=\"building\"><\u002Ftextarea><\u002Fdiv>\n          <div class=\"row2\">\n            <div class=\"field\"><label for=\"f-stage\">Stage<\u002Flabel><select id=\"f-stage\" required=\"\"><option value=\"\" disabled=\"\" selected=\"\">Select —<\u002Foption><option>Idea / pre-product<\u002Foption><option>Building / pre-revenue<\u002Foption><option>Revenue / scaling<\u002Foption><option>Spinout / carve-out<\u002Foption><\u002Fselect><\u002Fdiv>\n            <div class=\"field\"><label for=\"f-need\">What do you need?<\u002Flabel><select id=\"f-need\" required=\"\"><option value=\"\" disabled=\"\" selected=\"\">Select —<\u002Foption><option>Co-build partner<\u002Foption><option>Operators on-demand<\u002Foption><option>Equity / capital<\u002Foption><option>Something else<\u002Foption><\u002Fselect><\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"btn\" type=\"submit\">Send pitch →<\u002Fbutton>\n        <\u002Fform>\n        <div class=\"sent\" id=\"sent\">\n          <div class=\"mono\" style=\"color:var(--acc)\">● Received<\u002Fdiv>\n          <h3>We've got it.<\u002Fh3>\n          <p>We'll reply within 48 hours — usually faster, occasionally from a strange time zone.<\u002Fp>\n          <div class=\"ref mono\">REF · PP-V-0000<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CLOSER -->\n<section class=\"closer\" data-screen-label=\"Closer\">\n  <div class=\"wrap\">\n    <h2 class=\"reveal\">Ready to hand off the hard part?<\u002Fh2>\n    <p class=\"reveal\">Start with a warm intro, or pitch us a venture. Either way, you'll be talking to operators — not a sales team.<\u002Fp>\n    <div class=\"hero-cta reveal\">\n      <a href=\"#work\" class=\"btn btn-lg\">Get an introduction<\u002Fa>\n      <a href=\"#ventures\" class=\"btn btn-ghost btn-lg\">Pitch a venture →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer data-screen-label=\"Footer\">\n  <div class=\"wrap\">\n    <div class=\"foot-top\">\n      <div>\n        <img src=\"9993dc58-2390-4fa7-a600-360194e5de10\" alt=\"Pilot Projects\" style=\"height:58px;width:auto;display:block\">\n        <div class=\"foot-tag\">Operators and venture builders, running the engine room of growing companies.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"foot-nav\">\n        <div class=\"foot-col\">\n          <h5>Company<\u002Fh5>\n          <a href=\"#what\">What we do<\u002Fa>\n          <a href=\"#capabilities\">Capabilities<\u002Fa>\n          <a href=\"#global\">Global<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"foot-col\">\n          <h5>Start<\u002Fh5>\n          <a href=\"#work\">Get an intro<\u002Fa>\n          <a href=\"#ventures\">Pitch a venture<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-bottom mono\">\n      <span>© Pilot Projects Group · MMXXVI<\u002Fspan>\n      <span>Bangkok · Dubai · Mauritius · Cape Town · London · Miami · Chicago · Denver<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  const hdr=document.getElementById('hdr');\n  addEventListener('scroll',()=>hdr.classList.toggle('solid',scrollY>30),{passive:true});\n\n  const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:0.12});\n  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));\n\n  document.getElementById('pitch').addEventListener('submit',e=>{e.preventDefault();e.target.style.display='none';document.getElementById('sent').classList.add('show')});\n\n  /* ---- live world map ---- */\n  const cities=[\n    {c:\"Denver\",tz:\"America/Denver\",lat:39.74,lon:-104.99},\n    {c:\"Chicago\",tz:\"America/Chicago\",lat:41.88,lon:-87.63},\n    {c:\"Miami\",tz:\"America/New_York\",lat:25.76,lon:-80.19},\n    {c:\"London\",tz:\"Europe/London\",lat:51.5,lon:-0.12},\n    {c:\"Dubai\",tz:\"Asia/Dubai\",lat:25.2,lon:55.27},\n    {c:\"Cape Town\",tz:\"Africa/Johannesburg\",lat:-33.92,lon:18.42},\n    {c:\"Mauritius\",tz:\"Indian/Mauritius\",lat:-20.16,lon:57.5},\n    {c:\"Bangkok\",tz:\"Asia/Bangkok\",lat:13.75,lon:100.5},\n  ];\n  const VB={w:1000,h:470}, lonMin=-130,lonMax=120,latMax=60,latMin=-42;\n  const px=(lon)=> (lon-lonMin)/(lonMax-lonMin)*VB.w;\n  const py=(lat)=> (latMax-lat)/(latMax-latMin)*VB.h;\n  cities.forEach(c=>{c.x=px(c.lon);c.y=py(c.lat);});\n\n  const svg=document.getElementById('mapsvg');\n  let dots=\"\";\n  for(let gx=20;gx<VB.w;gx+=26){\n    for(let gy=18;gy<VB.h;gy+=26){\n      dots+=`<circle cx=\"${gx}\" cy=\"${gy}\" r=\"1.1\" fill=\"rgba(238,241,238,0.07)\"/>`;\n    }\n  }\n  let arcs=\"\";\n  for(let i=0;i<cities.length-1;i++){\n    const a=cities[i],b=cities[i+1];\n    const mx=(a.x+b.x)/2, my=Math.min(a.y,b.y)-Math.abs(b.x-a.x)*0.18-20;\n    arcs+=`<path d=\"M${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}\" fill=\"none\" stroke=\"url(#ag)\" stroke-width=\"1.1\" class=\"arc\" stroke-dasharray=\"4 5\"/>`;\n  }\n  svg.innerHTML=`<defs><linearGradient id=\"ag\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n    <stop offset=\"0\" stop-color=\"oklch(0.80 0.10 156)\" stop-opacity=\"0.05\"/>\n    <stop offset=\"0.5\" stop-color=\"oklch(0.80 0.10 156)\" stop-opacity=\"0.45\"/>\n    <stop offset=\"1\" stop-color=\"oklch(0.80 0.10 156)\" stop-opacity=\"0.05\"/>\n  <\u002FlinearGradient><\u002Fdefs>${dots}${arcs}`;\n\n  const map=document.getElementById('map');\n  cities.forEach(c=>{\n    const n=document.createElement('div');\n    n.className='node'+(c.x>VB.w*0.74?' flip':'');\n    n.style.left=(c.x/VB.w*100)+'%';\n    n.style.top=(c.y/VB.h*100)+'%';\n    n.innerHTML=`<span class=\"ring\"><\u002Fspan><span class=\"lab\"><span class=\"c\">${c.c}<\u002Fspan><span class=\"t\" data-tz=\"${c.tz}\">—<\u002Fspan><\u002Fspan>`;\n    map.appendChild(n);\n  });\n  function tick(){\n    document.querySelectorAll('.t[data-tz]').forEach(el=>{\n      const p=new Intl.DateTimeFormat('en-US',{timeZone:el.dataset.tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());\n      el.textContent=p;\n    });\n  }\n  tick();setInterval(tick,1000*15);\n\n  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;\n  document.querySelectorAll('.arc').forEach((p,i)=>{\n    const len=p.getTotalLength();\n    if(reduce){p.style.strokeDasharray=\"4 5\";return;}\n    p.style.strokeDasharray=len;p.style.strokeDashoffset=len;\n    p.style.transition=`stroke-dashoffset 1.1s ease ${0.25+i*0.12}s`;\n    requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.strokeDashoffset=0;}));\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
